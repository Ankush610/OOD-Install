# Site settings: the ONLY file to edit for a new cluster. Every script sources it.
# The values below are this cluster's (AI-Stack). Set them all before the first run:
# the LDAP base DN and every UID are baked into data, and can't be changed later.

# --- Nodes ----------------------------------------------------------------
MASTER_HOST=master                    # LDAP, registry, MLflow, k8s control plane, Slurm controller, gateway, Keycloak. Must match `hostname -s`
MASTER_IP=192.168.40.102              # and resolve to this IP on every node (/etc/hosts)
LOGIN_HOST=$MASTER_HOST               # OOD (Apache), users' SSH, the viewer partition. May be master itself (this test cluster). Must match its `hostname -s`
LOGIN_IP=$MASTER_IP                   # LOGIN_HOST's address as master sees it: the only one let in to Keycloak and the admin page's ssh key
COMPUTE_NODES="cn01 cn02"             # every node that runs jobs gets 1-ldap/2-client.sh
LOGIN_NODES="$LOGIN_HOST"             # where users SSH in and build with rootless podman (add-user.sh gives them subuids there)

# --- Container registry (0-registry) ------------------------------------------
REGISTRY=$MASTER_HOST:5000            # podman pushes here, every k8s node's containerd pulls from here (plain HTTP, LAN)
REGISTRY_DATA=/home/apps/registry     # its storage on master (the image layers; back this up, not the node caches)
REGISTRY_IMAGE=docker.io/library/registry:2

# --- LDAP (1-ldap) ----------------------------------------------------------
LDAP_BASE="dc=aistack,dc=local"       # root of the user tree
LDAP_INSTANCE=aistack                 # 389 DS instance: /etc/dirsrv/slapd-aistack
LDAP_URI="ldaps://$MASTER_HOST"       # what nodes use (port 636, TLS). The name must match the certificate
LDAP_DM="cn=Directory Manager"        # LDAP super-admin
LDAP_DM_PASS_FILE=/root/.ldap-dm.pass # its password (written by 1-ldap/1-server.sh, root only)
LDAP_CA=/home/apps/ldap/ca.crt        # server CA on the shared /home, so every node can trust it
MIN_UID=1000                          # people get UIDs from here (UID_MIN in /etc/login.defs)
MAX_UID=59999
LDAP_LAST_UID_FILE=/root/.ldap-last-uid   # highest UID ever handed out: a removed person's UID is never reused (back it up with LDAP)
KEEP_LOCAL="admin"                    # local accounts that never go into LDAP: the way back in if LDAP breaks

# --- Open OnDemand (2-ood) --------------------------------------------------
OOD_VERSION=4.2
OOD_SERVERNAME=localhost              # the exact host users type in the browser
OOD_CERT=/etc/pki/tls/certs/ood.crt   # on LOGIN_HOST: OOD's HTTPS certificate (2-ood makes a self-signed one); Keycloak (master) fetches it to trust logouts
OOD_OIDC_SECRET=/etc/ood/oidc-client.secret   # on LOGIN_HOST (root 0600): Keycloak client "ood"'s secret, pushed there by 6-keycloak/2-realm.sh

# --- Admin page (8-admin) ------------------------------------------------------
ADMIN_HELPER=/usr/local/sbin/aistack-admin   # on master: root-owned copy of 8-admin/aistack-admin.py; the admin page reaches it over ssh (ADMIN_KEY)
ADMIN_KEY=/etc/aistack-admin/id_ed25519      # on LOGIN_HOST, OOD_ADMIN only: master's root accepts it from LOGIN_IP and runs ONLY ADMIN_HELPER with it
ADMIN_LOG=/var/log/aistack-admin.log         # on master: every change made through it: who, what, when, result (root only)
ADMIN_NOTICES=/home/apps/admin-notices       # sticky (1777), shared /home: one file per job the admin stopped (with the admin's reason), owned by its user; the bell in OOD's top bar + VS Code/Jupyter/Model Hub show it until the user clears it
OOD_ADMIN=admin                       # local web login (htpasswd), works even when LDAP is down
OOD_AUTH=keycloak                         # OOD web login: ldap (Apache asks) | keycloak (one login, needs 6-keycloak); rerun 2-ood/setup-ood.sh after changing
CLUSTER_ID=aistack                    # OOD cluster file name + ID
CLUSTER_TITLE="AI-Stack"              # name users see in the Clusters menu
PORTAL_TITLE="AI-HPC-Cluster"         # web portal name: OOD top bar + tab title, Keycloak login heading
PORTAL_COLOR="#05295d"                # OOD top bar (navy)
SLURM_BIN=/usr/local/bin              # folder of sbatch (`which sbatch`)
SLURM_CONF=/etc/slurm/slurm.conf

# --- Keycloak: one login for OOD, MLflow, Model Hub (6-keycloak) ---------------
# Runs on master as two podman containers (Postgres + Keycloak) under systemd. Postgres + health on 127.0.0.1 only;
# Keycloak's HTTP on MASTER_IP, where firewalld lets in only LOGIN_IP (OOD's Apache) and master itself.
# Browsers reach it through OOD's Apache: https://$OOD_SERVERNAME$KEYCLOAK_PATH (same certificate, port 443).
# Users come from LDAP (read-only); LDAP stays the one user list and checks the passwords.
KEYCLOAK_VERSION=26.8.0               # quay.io/keycloak/keycloak tag; never "latest"
KEYCLOAK_IMAGE=$REGISTRY/keycloak:$KEYCLOAK_VERSION-rudra   # built by 6-keycloak/1-install.sh (optimized for Postgres)
KEYCLOAK_DB_IMAGE=$REGISTRY/postgres:17.11                  # mirrored from docker.io/library/postgres
KEYCLOAK_USER=keycloak                # local system account that runs both containers and owns KEYCLOAK_DATA
KEYCLOAK_UID=949                      # below MIN_UID, never in LDAP (the image's own UID 1000 is a person here)
KEYCLOAK_DATA=/home/apps/keycloak     # Postgres data + admin password (master's local disk, mode 700)
KEYCLOAK_PATH=/auth                   # URL path under OOD's address
KEYCLOAK_PORT=8180                    # on MASTER_IP: Apache proxies $KEYCLOAK_PATH here
KEYCLOAK_URL=http://$MASTER_IP:$KEYCLOAK_PORT$KEYCLOAK_PATH   # what OOD's Apache and the scripts call (plain HTTP on the cluster LAN)
KEYCLOAK_MGMT_PORT=9180               # 127.0.0.1 only: health + metrics
KEYCLOAK_DB_PORT=5433                 # 127.0.0.1 only (5432 may already be taken on master)
KEYCLOAK_REALM=$CLUSTER_ID            # the realm users log in to
KEYCLOAK_ADMIN=kcadmin                # Keycloak's own admin (master realm); its password: $KEYCLOAK_DATA/admin.pass

# --- MLflow (3-mlflow) ------------------------------------------------------
MLFLOW_VERSION=3.15.1                 # must equal mlflow== in 3-mlflow/image/requirements.txt
MLFLOW_IMAGE=$REGISTRY/mlflow-server:$MLFLOW_VERSION-sso   # -sso: ldap_auth.py also trusts OOD's login (Keycloak)
MLFLOW_PORT=30500                     # NodePort on MASTER_IP
MLFLOW_PREFIX=/node/$MASTER_IP/$MLFLOW_PORT   # URL path MLflow serves under (--static-prefix); "" for none
MLFLOW_URI=http://$MASTER_IP:$MLFLOW_PORT$MLFLOW_PREFIX   # the tracking URI users export
MLFLOW_DATA=/home/apps/mlflow-shared  # runs, registry, artifacts, users (on master's disk)
MLFLOW_USER=mlflow                    # local system account that owns MLFLOW_DATA and runs the pod
MLFLOW_UID=950                        # below MIN_UID, so it can never clash with a person in LDAP
MLFLOW_PROXY_SECRET=/etc/ood/mlflow-proxy.secret   # on LOGIN_HOST (root 0600): copy of MLFLOW_DATA/proxy.secret for OOD's Apache, pushed by 3-mlflow/2-deploy.sh

# --- VS Code in the browser (4-vscode) ----------------------------------------
CODE_SERVER_VERSION=4.139.1           # github.com/coder/code-server releases
CODE_SERVER_ROOT=/home/apps/code-server   # one install on the shared /home, every node runs it
VIEWER_PARTITION=viewer               # OOD tool sessions (VS Code "editor only"): on LOGIN_HOST, compute nodes stay free
VIEWER_NODE=viewer01                 # LOGIN_HOST's Slurm node name. NOT the hostname: slurm-bridge taints k8s nodes whose name matches a Slurm node
# LOGIN_HOST's cores/memory come from `slurmd -C`; these are kept OUT of Slurm, so SSH logins and its own
# services (OOD; on a one-machine cluster also LDAP, k8s control plane, MLflow, slurmctld, registry) always have room
VIEWER_RESERVED_CORES=8               # Slurm CoreSpecCount
VIEWER_RESERVED_MEM_MB=49152          # Slurm MemSpecLimit (48 GB)
VIEWER_OVERSUBSCRIBE=4                # tool sessions per core (an idle editor uses ~0 CPU)
VSCODE_MEM=2G                         # per editor session (language servers need ~1-2G); memory is the real limit
VSCODE_IDLE_SECONDS=3600              # an editor with no browser attached this long stops, freeing its memory
# GPU sessions: 4-vscode/3-install-ood-app.sh asks Slurm (sinfo) for the GPU partition, GPU type, GPUs per node
# and each GPU's share of the node's CPUs/RAM. Users pick 1..<GPUs per node> in the form.
GPU_PARTITION=auto                    # auto = Slurm's default partition with GPUs, else the first; or a name; "" = no GPU choice

# --- Model Hub (5-model-hub) --------------------------------------------------
MODELS_ROOT=/home/apps/models          # admin base models (base/), read-only to users and pods
MODELHUB_USER=modelhub                # local system account that owns MODELS_ROOT (like MLFLOW_USER)
MODELHUB_UID=951                      # below MIN_UID, never in LDAP
BRIDGE_PARTITION=slurm-bridge         # Slurm partition slurm-bridge puts pods in (its Helm schedulerConfig.partition)
BRIDGE_NS=slurm                       # namespace of the slurm-bridge Helm release (its scheduler-config ConfigMap)
# Limits for everyone. One person's exception: sudo bash 5-model-hub/2-sync-users.sh <user> --gpus N --max-hours H
# (--reset = back to these, --show = the table). After changing a value here: rerun 2-sync-users.sh (all users).
USER_GPU_QUOTA=1                      # GPUs one user's endpoints may hold at once
ENDPOINT_HOURS_DEFAULT=24             # run time when the user doesn't choose
ENDPOINT_HOURS_MAX=96                 # longest an endpoint may run (enforced by the cluster, not just the UI)
NFS_SERVER=$MASTER_IP                 # serves /home to pods (per-user PVs). Dummy: master exports /home
APPTAINER=/home/apps/apptainer/bin/apptainer   # same path as in $CONTAINERS_ROOT/apptainer.sh
# Apptainer images (see its README.md): training/<family>/<name>.sif (Jupyter offers every one), serving/, test-scripts/
CONTAINERS_ROOT=/home/apps/containers
# Serving images are built to match these training SIFs (4-images.sh copies each SIF's pip freeze in as constraints).
# model-register runs in ML_TRAIN_SIF: after changing it, rerun 5-model-hub/1-setup.sh
ML_TRAIN_SIF=$CONTAINERS_ROOT/training/ml-classic/ml-classic-cpu.sif
TORCH_TRAIN_SIF=$CONTAINERS_ROOT/training/pytorch/pytorch-2.10.0-cuda12.9.sif
VLLM_VERSION=v0.30.0                  # docker.io/vllm/vllm-openai tag mirrored to $REGISTRY; never "latest"
# Gateway: the one HTTPS address for calling models (5-model-hub/8-gateway.sh). Every call needs the caller's
# personal API key (Model Hub -> My API key); only the endpoint's owner may call it (sharing: later).
GATEWAY_NS=model-hub                  # k8s namespace (not Slurm-managed: always on, pinned to master like MLflow)
GATEWAY_IP=192.168.40.205             # fixed address from the MetalLB pool; customers: an IP on their network
GATEWAY_HOST=""                       # DNS name for it, if the site has one ("" = use the IP); goes into the certificate
GATEWAY_URL=https://${GATEWAY_HOST:-$GATEWAY_IP}   # what users call
GATEWAY_TLS_SECRET=""                 # "" = a self-signed Rudra CA (users download ca.crt); or a k8s TLS Secret the customer gives
GATEWAY_CA=/home/apps/gateway/ca.crt  # that self-signed CA (public), written by 8-gateway.sh on the shared /home; Model Hub offers it
GATEWAY_NGINX_IMAGE=$REGISTRY/nginx-unprivileged:1.30.5-alpine   # mirrored from docker.io/nginxinc
GATEWAY_PY_IMAGE=$REGISTRY/python:3.12.15-slim                   # mirrored from docker.io/library; runs gateway/auth.py
# Model Hub's API tab shows users `ssh -L 8080:<endpoint ClusterIP>:8080 <user>@$MASTER_HOST` to reach an endpoint
# from their own machine. SSH_JUMP: a jump host in between, as host or user@host (host alone = the user's own name); "" = none
SSH_JUMP=10.208.34.138

# --- Monitoring (9-monitoring) ------------------------------------------------
# One Prometheus on master: the single place every app (OOD, Model Hub, later others) reads cluster metrics from.
# It collects node_exporter on every node, which also carries our GPU (nvidia-smi) and Slurm (scontrol/squeue) collectors.
# Nothing it reads was set up by someone else (no GPU operator, no k8s, no change to slurm.conf).
PROMETHEUS_VERSION=3.5.5              # github.com/prometheus/prometheus releases (3.5 = long-term support); never "latest"
PROMETHEUS_SHA256=64d0beab873272b861a91df41668bc852c7e2e5b23f75c16059fb15b5630c577   # of prometheus-<ver>.linux-amd64.tar.gz (the release's sha256sums.txt): change with the version
NODE_EXPORTER_VERSION=1.12.1          # github.com/prometheus/node_exporter releases
NODE_EXPORTER_SHA256=b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
MONITOR_ROOT=/home/apps/monitoring    # the downloaded releases, on the shared /home: nodes install from here (no internet needed)
PROM_DATA=/var/lib/prometheus         # its database: master's LOCAL disk (Prometheus' database must not be on NFS)
PROM_PORT=9090                        # on MASTER_IP; firewalld lets in only LOGIN_IP (and master itself)
PROM_URL=http://$MASTER_IP:$PROM_PORT # what apps call (read-only API: /api/v1/query)
PROM_RETENTION=30d                    # history kept this long, or until PROM_RETENTION_SIZE, whichever comes first
PROM_RETENTION_SIZE=20GB
NODE_EXPORTER_PORT=9100               # on every node; firewalld lets in only MASTER_IP
# core services (alert ServiceDown when one stops); a regex of systemd unit names. Each node watches the ones it has ENABLED
# (rerun 1-install.sh after enabling one). Without .service; no backslash, % or $ (systemd unescapes them)
MONITOR_UNITS='slurmctld|slurmd|slurmrestd|munge|sssd|dirsrv@.*|httpd|keycloak|keycloak-db|kubelet|containerd|nfs-server'

# --- Jupyter in the browser (7-jupyter) ---------------------------------------
# Same sessions as VS Code (its viewer partition, GPU choices and page), JupyterLab instead of code-server.
JUPYTER_ROOT=/home/apps/jupyter       # one install on the shared /home (its own Python + JupyterLab), every node runs it
JUPYTER_PYTHON=3.12.15+20261003       # python-build-standalone build: JupyterLab needs Python >= 3.10, AlmaLinux 9 has 3.9
JUPYTER_MEM=4G                        # per "Notebook only" session: a notebook's data sits in its kernel's memory
JUPYTER_IDLE_SECONDS=3600             # a kernel idle this long with no browser attached stops; then the session stops
# Kernels: every $CONTAINERS_ROOT/training/*/*.sif, found when a session starts (a new SIF shows in the next session)
