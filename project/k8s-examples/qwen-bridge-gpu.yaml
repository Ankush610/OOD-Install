apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-bridge-gpu
  namespace: slurm-bridge

spec:
  replicas: 1

  selector:
    matchLabels:
      app: qwen-gpu

  template:
    metadata:
      labels:
        app: qwen-gpu

      annotations:
        slurmjob.slinky.slurm.net/job-name: qwen-inference-gpu
        slurmjob.slinky.slurm.net/partition: slurm-bridge
        slurmjob.slinky.slurm.net/exclusive: "false"

        # IMPORTANT:
        # This exact syntax was proven to work with Slurm REST.
        slurmjob.slinky.slurm.net/gres: "gres:gpu:a30:1"

        slurmjob.slinky.slurm.net/timelimit: "1440"

    spec:
      schedulerName: slurm-bridge-scheduler

      tolerations:
      - key: slinky.slurm.net/managed-node
        operator: Equal
        value: slurm-bridge-scheduler
        effect: NoExecute

      containers:
      - name: qwen
        image: master:5000/qwen-llama:0.5b-cuda
        imagePullPolicy: IfNotPresent

        args:
        - "-m"
        - "/models/qwen.gguf"

        - "--host"
        - "0.0.0.0"

        - "--port"
        - "8080"

        - "-c"
        - "4096"

        - "-ngl"
        - "99"

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        resources:
          requests:
            cpu: "4"
            memory: 2Gi
            nvidia.com/gpu: "1"

          limits:
            cpu: "4"
            memory: 4Gi
            nvidia.com/gpu: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: qwen-gpu
  namespace: slurm-bridge

spec:
  selector:
    app: qwen-gpu

  ports:
  - name: http
    port: 8080
    targetPort: 8080

  type: ClusterIP
