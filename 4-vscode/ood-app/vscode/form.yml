# ${...} are filled in from ../../../site.conf by ../../3-install-ood-app.sh
cluster: "${CLUSTER_ID}"
form:
  - where
  - bc_num_hours
attributes:
  where:
    widget: select
    label: "Where to run"
    help: "Editor only: light, starts at once, shares cores on the login node, no GPU. GPU node: VS Code runs on a compute node with that many GPUs (plus their share of CPUs and memory), held for the whole session."
    options:
      - ["Editor only (login node)", "viewer"]
      # GPU_OPTIONS: one line per GPU count, written by 3-install-ood-app.sh from Slurm
  bc_num_hours:
    value: 4
    min: 1
    max: 12
