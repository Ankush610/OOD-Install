# GENERATED from node-alerts.jsonnet (node_exporter 1.12.1 node-mixin + our overrides): edit that, re-render (see its header).
# Copied to /etc/prometheus/node-alerts.yml by 1-install.sh. Disk, inode, RAID, clock, network, file-descriptor alerts.
groups:
- name: node-exporter
  rules:
  - alert: NodeFilesystemSpaceFillingUp
    annotations:
      summary: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.node }} has only {{ printf "%.2f" $value }}% available space left and is filling up.
    expr: |
      (
        node_filesystem_avail_bytes{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} / node_filesystem_size_bytes{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} * 100 < 40
      and
        predict_linear(node_filesystem_avail_bytes{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""}[6h], 24*60*60) < 0
      and
        node_filesystem_readonly{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} == 0
      )
    for: 1h
    labels:
      severity: warning
  - alert: NodeFilesystemSpaceFillingUp
    annotations:
      summary: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.node }} has only {{ printf "%.2f" $value }}% available space left and is filling up fast.
    expr: |
      (
        node_filesystem_avail_bytes{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} / node_filesystem_size_bytes{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} * 100 < 20
      and
        predict_linear(node_filesystem_avail_bytes{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""}[6h], 4*60*60) < 0
      and
        node_filesystem_readonly{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} == 0
      )
    for: 1h
    labels:
      severity: critical
  - alert: NodeFilesystemAlmostOutOfSpace
    annotations:
      summary: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.node }} has only {{ printf "%.2f" $value }}% available space left.
    expr: |
      (
        node_filesystem_avail_bytes{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} / node_filesystem_size_bytes{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} * 100 < 5
      and
        node_filesystem_readonly{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} == 0
      )
    for: 30m
    labels:
      severity: warning
  - alert: NodeFilesystemAlmostOutOfSpace
    annotations:
      summary: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.node }} has only {{ printf "%.2f" $value }}% available space left.
    expr: |
      (
        node_filesystem_avail_bytes{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} / node_filesystem_size_bytes{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} * 100 < 3
      and
        node_filesystem_readonly{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} == 0
      )
    for: 30m
    labels:
      severity: critical
  - alert: NodeFilesystemFilesFillingUp
    annotations:
      summary: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.node }} has only {{ printf "%.2f" $value }}% available inodes left and is filling up.
    expr: |
      (
        node_filesystem_files_free{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} / node_filesystem_files{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} * 100 < 40
      and
        predict_linear(node_filesystem_files_free{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""}[6h], 24*60*60) < 0
      and
        node_filesystem_readonly{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} == 0
      )
    for: 1h
    labels:
      severity: warning
  - alert: NodeFilesystemFilesFillingUp
    annotations:
      summary: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.node }} has only {{ printf "%.2f" $value }}% available inodes left and is filling up fast.
    expr: |
      (
        node_filesystem_files_free{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} / node_filesystem_files{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} * 100 < 20
      and
        predict_linear(node_filesystem_files_free{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""}[6h], 4*60*60) < 0
      and
        node_filesystem_readonly{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} == 0
      )
    for: 1h
    labels:
      severity: critical
  - alert: NodeFilesystemAlmostOutOfFiles
    annotations:
      summary: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.node }} has only {{ printf "%.2f" $value }}% available inodes left.
    expr: |
      (
        node_filesystem_files_free{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} / node_filesystem_files{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} * 100 < 5
      and
        node_filesystem_readonly{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} == 0
      )
    for: 1h
    labels:
      severity: warning
  - alert: NodeFilesystemAlmostOutOfFiles
    annotations:
      summary: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint }}, at {{ $labels.node }} has only {{ printf "%.2f" $value }}% available inodes left.
    expr: |
      (
        node_filesystem_files_free{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} / node_filesystem_files{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} * 100 < 3
      and
        node_filesystem_readonly{job="node",fstype=~"ext4|xfs|btrfs",mountpoint!=""} == 0
      )
    for: 1h
    labels:
      severity: critical
  - alert: NodeNetworkReceiveErrs
    annotations:
      summary: '{{ $labels.node }} interface {{ $labels.device }} has encountered {{ printf "%.0f" $value }} receive errors in the last two minutes.'
    expr: |
      rate(node_network_receive_errs_total{job="node"}[2m]) / rate(node_network_receive_packets_total{job="node"}[2m]) > 0.01
    for: 1h
    labels:
      severity: warning
  - alert: NodeNetworkTransmitErrs
    annotations:
      summary: '{{ $labels.node }} interface {{ $labels.device }} has encountered {{ printf "%.0f" $value }} transmit errors in the last two minutes.'
    expr: |
      rate(node_network_transmit_errs_total{job="node"}[2m]) / rate(node_network_transmit_packets_total{job="node"}[2m]) > 0.01
    for: 1h
    labels:
      severity: warning
  - alert: NodeHighNumberConntrackEntriesUsed
    annotations:
      summary: '{{ $labels.node }} {{ $value | humanizePercentage }} of conntrack entries are used.'
    expr: |
      (node_nf_conntrack_entries{job="node"} / node_nf_conntrack_entries_limit) > 0.75
    labels:
      severity: warning
  - alert: NodeTextFileCollectorScrapeError
    annotations:
      summary: Node Exporter text file collector on {{ $labels.node }} failed to scrape.
    expr: |
      node_textfile_scrape_error{job="node"} == 1
    labels:
      severity: warning
  - alert: NodeClockSkewDetected
    annotations:
      summary: Clock at {{ $labels.node }} is out of sync by more than 0.05s. Ensure NTP is configured correctly on this host.
    expr: |
      (
        node_timex_offset_seconds{job="node"} > 0.05
      and
        deriv(node_timex_offset_seconds{job="node"}[5m]) >= 0
      )
      or
      (
        node_timex_offset_seconds{job="node"} < -0.05
      and
        deriv(node_timex_offset_seconds{job="node"}[5m]) <= 0
      )
    for: 10m
    labels:
      severity: warning
  - alert: NodeClockNotSynchronising
    annotations:
      summary: Clock at {{ $labels.node }} is not synchronising. Ensure NTP is configured on this host.
    expr: |
      min_over_time(node_timex_sync_status{job="node"}[5m]) == 0
      and
      node_timex_maxerror_seconds{job="node"} >= 16
    for: 10m
    labels:
      severity: warning
  - alert: NodeRAIDDegraded
    annotations:
      summary: RAID array '{{ $labels.device }}' at {{ $labels.node }} is in degraded state due to one or more disks failures. Number of spare drives is insufficient to fix issue automatically.
    expr: |
      node_md_disks_required{job="node",device!=""} - ignoring (state) (node_md_disks{state="active",job="node",device!=""}) > 0
    for: 15m
    labels:
      severity: critical
  - alert: NodeRAIDDiskFailure
    annotations:
      summary: At least one device in RAID array at {{ $labels.node }} failed. Array '{{ $labels.device }}' needs attention and possibly a disk swap.
    expr: |
      node_md_disks{state="failed",job="node",device!=""} > 0
    labels:
      severity: warning
  - alert: NodeFileDescriptorLimit
    annotations:
      summary: File descriptors limit at {{ $labels.node }} is currently at {{ printf "%.2f" $value }}%.
    expr: |
      (
        node_filefd_allocated{job="node"} * 100 / node_filefd_maximum{job="node"} > 70
      )
    for: 15m
    labels:
      severity: warning
  - alert: NodeFileDescriptorLimit
    annotations:
      summary: File descriptors limit at {{ $labels.node }} is currently at {{ printf "%.2f" $value }}%.
    expr: |
      (
        node_filefd_allocated{job="node"} * 100 / node_filefd_maximum{job="node"} > 90
      )
    for: 15m
    labels:
      severity: critical
  - alert: NodeMemoryMajorPagesFaults
    annotations:
      summary: |
        Memory major pages are occurring at very high rate at {{ $labels.node }}, 500 major page faults per second for the last 15 minutes, is currently at {{ printf "%.2f" $value }}.
        Please check that there is enough memory available at this instance.
    expr: |
      rate(node_vmstat_pgmajfault{job="node"}[5m]) > 500
    for: 15m
    labels:
      severity: warning
  - alert: NodeMemoryHighUtilization
    annotations:
      summary: |
        Memory is filling up at {{ $labels.node }}, has been above 90% for the last 15 minutes, is currently at {{ printf "%.2f" $value }}%.
    expr: |
      100 - (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} * 100) > 90
    for: 15m
    labels:
      severity: warning
  - alert: NodeDiskIOSaturation
    annotations:
      summary: |
        Disk IO queue (aqu-sq) is high on {{ $labels.device }} at {{ $labels.node }}, has been above 10 for the last 30 minutes, is currently at {{ printf "%.2f" $value }}.
        This symptom might indicate disk saturation.
    expr: |
      rate(node_disk_io_time_weighted_seconds_total{job="node", device!=""}[5m]) > 10
    for: 30m
    labels:
      severity: warning
  - alert: NodeSystemdServiceCrashlooping
    annotations:
      summary: Systemd service {{ $labels.name }} has being restarted too many times at {{ $labels.node }} for the last 15 minutes. Please check if service is crash looping.
    expr: |
      increase(node_systemd_service_restart_total{job="node"}[5m]) > 2
    for: 15m
    labels:
      severity: warning
  - alert: NodeBondingDegraded
    annotations:
      summary: Bonding interface {{ $labels.master }} on {{ $labels.node }} is in degraded state due to one or more slave failures.
    expr: |
      (node_bonding_slaves{job="node"} - node_bonding_active{job="node"}) != 0
    for: 5m
    labels:
      severity: warning

