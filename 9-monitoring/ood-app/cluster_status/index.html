<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cluster monitor</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cluster.css">
  <link rel="stylesheet" href="/public/ai-factory/app-bar.css">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar app-bar bg-body sticky-top py-2" data-bs-theme="dark">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <a class="portal-logo" href="/pun/sys/dashboard" title="Back to the portal"><img src="/public/ai-factory/cdac-logo.svg" alt="Portal home"></a>
        <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="#"><span class="brand-mark"><i class="bi bi-hdd-rack"></i></span>Cluster monitor</a>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="logged-in small d-none d-md-inline" id="updated" aria-live="polite"></span>
        <button class="btn btn-sm btn-icon" id="refresh" type="button" aria-label="Refresh now" title="Refresh now"><i class="bi bi-arrow-clockwise"></i></button>
        <span class="logged-in d-none d-lg-inline ms-2" id="who"></span>
        <button class="btn btn-sm btn-icon" id="theme" type="button" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
      </div>
    </div>
  </nav>
  <main class="container-xxl py-4" id="app"></main>

  <div class="modal fade node-detail" tabindex="-1" id="detail" aria-labelledby="detail-title"><div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content">
    <div class="modal-header"><div class="min-w-0" id="detail-head"></div>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body" id="detail-body"></div>
  </div></div></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
