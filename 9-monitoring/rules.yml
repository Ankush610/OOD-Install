# Prometheus rules, copied to /etc/prometheus/rules.yml by 1-install.sh.
# Recording rules = named queries: apps (OOD, Model Hub, ...) ask for these names instead of writing their own PromQL,
# so a change in how something is measured happens here once. Every series has a `node` label (the hostname).
# Alerts: visible at PROM_URL/alerts and /api/v1/alerts. Nothing sends them anywhere yet (no Alertmanager).
# Disk, inode, RAID, memory, clock, network alerts: node-alerts.yml (node_exporter's own set).
groups:
  - name: node                                # node_exporter, every node
    rules:
      - record: node:cpu_used:ratio
        expr: 1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
      - record: node:mem_used:ratio
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
      - record: node:disk_used:ratio          # the root filesystem
        expr: 1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
      - record: node:load1_per_cpu:ratio
        expr: node_load1 / on (node) count by (node) (node_cpu_seconds_total{mode="idle"})

  - name: gpu                                 # gpu-metrics.sh (nvidia-smi), one series per GPU: node, gpu, name, uuid
    rules:
      - record: gpu:util:ratio
        expr: gpu_utilization_ratio
      - record: gpu:mem_used:ratio
        expr: gpu_memory_used_bytes / gpu_memory_total_bytes
      - record: gpu:mem_used:bytes
        expr: gpu_memory_used_bytes
      - record: gpu:temp:celsius
        expr: gpu_temperature_celsius

  - name: slurm                               # slurm-metrics.py, one series per node: node (hostname), slurm_node
    rules:
      - record: slurm:node_cpus_alloc:ratio   # share of the CPUs jobs can get that are reserved now
        expr: slurm_node_cpus_alloc / (slurm_node_cpus > 0)
      - record: slurm:node_mem_alloc:ratio
        expr: slurm_node_memory_alloc_bytes / (slurm_node_memory_bytes > 0)
      - record: slurm:node_gpus_free          # GPUs a new job/endpoint could get on this node now (0 if it's down)
        expr: (slurm_node_gpus - slurm_node_gpus_alloc) * slurm_node_available
      - record: slurm:gpus_free               # the whole cluster
        expr: sum(slurm:node_gpus_free)

  - name: alerts
    rules:
      - alert: TargetDown                     # a node is off / unreachable, or its node_exporter stopped
        expr: up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.node }} has not answered for 5 minutes"
      - alert: ServiceDown                    # a core service (MONITOR_UNITS in site.conf) stopped or failed
        expr: node_systemd_unit_state{state="active"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.node }} is not running (systemctl status {{ $labels.name }})"
      - alert: ServiceUnreachable             # blackbox_exporter can't reach it (job blackbox in prometheus.yml)
        expr: probe_success == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} doesn't answer ({{ $labels.instance }})"
      - alert: CertificateExpiresSoon         # OOD, LDAP, gateway (self-signed: nobody renews them for us)
        expr: 7 * 86400 <= probe_ssl_earliest_cert_expiry - time() < 30 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} certificate expires in {{ $value | humanizeDuration }} ({{ $labels.instance }})"
      - alert: CertificateExpiresVerySoon
        expr: probe_ssl_earliest_cert_expiry - time() < 7 * 86400
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} certificate expires in {{ $value | humanizeDuration }} ({{ $labels.instance }}): renew it now"
      - alert: SlurmNodeUnavailable           # down, drained, not responding...: takes no new jobs
        expr: (slurm_node_available == 0) * on (slurm_node) group_left (state, reason) slurm_node_info
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Slurm node {{ $labels.slurm_node }} is {{ $labels.state }}: {{ $labels.reason }}"
      - alert: CollectorFailing               # nvidia-smi or scontrol/squeue failed (journalctl -u gpu-metrics / slurm-metrics)
        expr: gpu_collector_ok == 0 or slurm_collector_ok == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.__name__ }} on {{ $labels.node }}: the collector fails"
      - alert: CollectorStale                 # its timer stopped: numbers would be old
        expr: time() - node_textfile_mtime_seconds > 120
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.file }} on {{ $labels.node }} not updated for {{ $value | humanizeDuration }}"
      - alert: GpuEccErrors                   # uncorrectable memory errors: drain the node, reset the GPU
        expr: gpu_ecc_errors_uncorrected > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.node }} GPU {{ $labels.gpu }} ({{ $labels.name }}): {{ $value }} uncorrectable memory errors; drain the node, reset the GPU"
      - alert: GpuRemapPending                # a bad memory row is replaced at the next GPU reset
        expr: gpu_remapped_rows_pending == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.node }} GPU {{ $labels.gpu }} ({{ $labels.name }}) needs a reset to repair its memory (when idle)"
      - alert: GpuThrottled                   # hardware slowdown: power brake or overheating
        expr: gpu_hw_slowdown == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.node }} GPU {{ $labels.gpu }} ({{ $labels.name }}) slowed down by the hardware (power or heat)"
      - alert: GpuMissing                     # Slurm has more GPUs on a node than nvidia-smi shows: one fell off the bus
        expr: slurm_node_gpus > on (node) group_left () (count by (node) (gpu_memory_total_bytes) or on (node) (0 * gpu_collector_ok))
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.node }}: Slurm has {{ $value }} GPUs, nvidia-smi sees fewer (GPU fell off the bus?)"
      - alert: GpuHot
        expr: gpu:temp:celsius > 85
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.node }} GPU {{ $labels.gpu }} ({{ $labels.name }}) at {{ $value }} °C"

  - name: prometheus                          # Prometheus watching itself (from prometheus-mixin)
    rules:
      - alert: PrometheusBadConfig            # a reload failed: it keeps running the OLD config and rules
        expr: max_over_time(prometheus_config_last_reload_successful{job="prometheus"}[5m]) == 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Prometheus on {{ $labels.node }} rejected its new config: still running the old one (journalctl -u prometheus)"
      - alert: PrometheusRuleFailures         # a rule errors every evaluation: its alert can't fire
        expr: increase(prometheus_rule_evaluation_failures_total{job="prometheus"}[5m]) > 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "Prometheus on {{ $labels.node }}: rule group {{ $labels.rule_group }} fails to evaluate"
      - alert: PrometheusTSDBCompactionsFailing   # it can't merge its data blocks: disk fills, queries slow
        expr: increase(prometheus_tsdb_compactions_failed_total{job="prometheus"}[3h]) > 0
        for: 4h
        labels: {severity: warning}
        annotations:
          summary: "Prometheus on {{ $labels.node }}: {{ $value | humanize }} failed compactions in 3 h (disk full? journalctl -u prometheus)"
