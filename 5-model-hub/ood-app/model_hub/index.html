<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model Hub</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-md bg-body border-bottom sticky-top">
    <div class="container-xl">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="#/">
        <span class="brand-mark"><i class="bi bi-boxes"></i></span>Model Hub
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav"
              aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" data-nav="models" href="#/"><i class="bi bi-grid me-1"></i>Models</a></li>
          <li class="nav-item"><a class="nav-link" data-nav="endpoints" href="#/endpoints"><i class="bi bi-hdd-network me-1"></i>Endpoints</a></li>
          <li class="nav-item"><a class="nav-link" data-nav="key" href="#/key"><i class="bi bi-key me-1"></i>API key</a></li>
          <li class="nav-item"><a class="nav-link" data-nav="help" href="#/help"><i class="bi bi-question-circle me-1"></i>Help</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span class="badge rounded-pill bg-body-secondary text-body border" id="who"></span>
          <button class="btn btn-sm btn-outline-secondary" id="theme" type="button" aria-label="Toggle dark mode"><i class="bi bi-moon-stars"></i></button>
        </div>
      </div>
    </div>
  </nav>
  <main class="container-xl py-4" id="app"></main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast align-items-center border-0 text-bg-dark" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex"><div class="toast-body" id="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
    </div>
  </div>

  <div class="modal fade" id="confirm" tabindex="-1" aria-labelledby="confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h1 class="modal-title fs-5" id="confirm-title">Delete endpoint?</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="confirm-body"></div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-ok"><i class="bi bi-trash me-1"></i>Delete</button></div>
    </div></div>
  </div>

  <div class="modal fade" id="yaml" tabindex="-1" aria-labelledby="yaml-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h1 class="modal-title fs-5" id="yaml-title">What will be created</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><pre class="code mb-0" id="yaml-body"></pre></div>
    </div></div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
