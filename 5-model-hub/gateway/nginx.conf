# The gateway: https://<GATEWAY>/<owner>/<endpoint>/<path>  ->  http://<endpoint>.u-<owner>.svc:8080/<path>
# Every call is first checked by auth.py (same pod, 127.0.0.1:8081): the caller's key, and may they call it.
# The caller's key never reaches the model; for vLLM, auth.py hands nginx the endpoint's own key instead.
# ${...} are filled by 8-gateway.sh (envsubst with an explicit list, so nginx's own $variables stay).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  log_format calls escape=json '{"t":"$time_iso8601","status":$status,"auth":"$auth_reason","owner":"$owner",'
                               '"endpoint":"$ep","path":"$rest","bytes":$body_bytes_sent,"secs":$request_time}';
  access_log /dev/stdout calls;
  client_body_temp_path /tmp/body;  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fcgi;  uwsgi_temp_path /tmp/uwsgi;  scgi_temp_path /tmp/scgi;
  server_tokens off;
  client_max_body_size 100m;                         # images, big tensors
  resolver ${DNS_IP} valid=30s ipv6=off;             # cluster DNS: <endpoint>.u-<owner>.svc

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location = / { return 200 "Model Hub gateway. Call https://<this address>/<owner>/<endpoint>/... with your API key.\n"; }

    location = /_auth {
      internal;
      proxy_pass http://127.0.0.1:8081/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      # the owner/endpoint nginx actually routes to (from the normalized path), NOT $request_uri: a raw
      # "/me/mine/../../bob/his" is routed to bob/his, so checking the raw text would let it through
      proxy_set_header X-Original-URI /$owner/$ep$rest;
      proxy_set_header Authorization $http_authorization;
    }

    # /<owner>/<endpoint>[/<rest>]: names as Linux users / k8s names allow, nothing else
    location ~ "^/(?<owner>[a-z_][a-z0-9_.-]{0,31})/(?<ep>[a-z0-9](?:[a-z0-9-]{0,40}[a-z0-9])?)(?<rest>/.*)?$" {
      auth_request /_auth;
      auth_request_set $auth_reason $upstream_http_x_gateway_reason;
      auth_request_set $upstream_auth $upstream_http_x_upstream_authorization;
      error_page 401 = @denied401;
      error_page 403 = @denied403;

      if ($rest = "") { set $rest "/"; }
      proxy_pass http://$ep.u-$owner.svc.cluster.local:8080$rest$is_args$args;
      proxy_set_header Authorization $upstream_auth;   # empty = not sent (ML/DL models have no key)
      proxy_set_header Host $ep;
      proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1;
      proxy_buffering off;                             # LLM answers stream token by token
      proxy_request_buffering off;
      proxy_read_timeout 600s;                         # a long generation or a slow first load
      proxy_send_timeout 600s;
    }

    location @denied401 { default_type application/json; return 401 '{"error":"$auth_reason"}\n'; }
    location @denied403 { default_type application/json; return 403 '{"error":"$auth_reason"}\n'; }
    location / { default_type application/json; return 404 '{"error":"address must be /<owner>/<endpoint>/..."}\n'; }
  }
}
