# Cluster-wide, once (1-setup.sh). In every namespace labelled aistack/uid (the per-user u-<user> namespaces),
# pods must run as that uid/gid: NFS trusts whatever UID a pod claims, so without this a pod in u-bob could set
# runAsUser to alice's UID and read alice's home through its volumes. No supplementalGroups/fsGroup either
# (they'd add group read rights). Containers may repeat the pod's uid/gid but not change them.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: pod-runs-as-namespace-owner }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "pods/ephemeralcontainers"]
  variables:
  - name: uid
    expression: "namespaceObject.metadata.labels['aistack/uid']"
  - name: gid
    expression: "namespaceObject.metadata.labels['aistack/gid']"
  validations:
  - expression: >-
      has(object.spec.securityContext) &&
      has(object.spec.securityContext.runAsUser) && string(object.spec.securityContext.runAsUser) == variables.uid &&
      has(object.spec.securityContext.runAsGroup) && string(object.spec.securityContext.runAsGroup) == variables.gid &&
      !has(object.spec.securityContext.supplementalGroups) && !has(object.spec.securityContext.fsGroup)
    message: "pod securityContext must set runAsUser/runAsGroup to your own uid/gid, with no supplementalGroups/fsGroup"
  - expression: >-
      object.spec.containers.all(c, !has(c.securityContext) ||
        ((!has(c.securityContext.runAsUser) || string(c.securityContext.runAsUser) == variables.uid) &&
         (!has(c.securityContext.runAsGroup) || string(c.securityContext.runAsGroup) == variables.gid)))
    message: "containers may not run as a different runAsUser/runAsGroup than the namespace owner"
  - expression: >-
      !has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.securityContext) ||
        ((!has(c.securityContext.runAsUser) || string(c.securityContext.runAsUser) == variables.uid) &&
         (!has(c.securityContext.runAsGroup) || string(c.securityContext.runAsGroup) == variables.gid)))
    message: "initContainers may not run as a different runAsUser/runAsGroup than the namespace owner"
  - expression: >-
      !has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, !has(c.securityContext) ||
        ((!has(c.securityContext.runAsUser) || string(c.securityContext.runAsUser) == variables.uid) &&
         (!has(c.securityContext.runAsGroup) || string(c.securityContext.runAsGroup) == variables.gid)))
    message: "ephemeralContainers may not run as a different runAsUser/runAsGroup than the namespace owner"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: pod-runs-as-namespace-owner }
spec:
  policyName: pod-runs-as-namespace-owner
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions: [{ key: aistack/uid, operator: Exists }]
---
# Cluster-wide, once (1-setup.sh). Every pod in a user namespace is a Slurm job (slurm-bridge), so it must carry a
# time limit in whole minutes, at most the namespace's aistack/max-hours (set by 2-sync-users.sh). Without the
# annotation slurm-bridge submits the job with the partition's limit (365 days here). It must also share the node
# (exclusive "false"): slurm-bridge's default is the whole node, even for a 2-CPU pod.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: pod-has-time-limit }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]                  # Slurm takes the limit at creation; later edits change nothing,
      resources: ["pods"]                     # and checking updates could block slurm-bridge cleaning up older pods
  variables:
  - name: ann
    expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
  - name: limit
    expression: "variables.ann[?'slurmjob.slinky.slurm.net/timelimit'].orValue('')"
  - name: maxHours
    expression: "namespaceObject.metadata.labels[?'aistack/max-hours'].orValue('')"
  validations:
  - expression: "variables.maxHours.matches('^[0-9]+$')"
    message: "this namespace has no aistack/max-hours label: ask the admin to run 5-model-hub/2-sync-users.sh"
  - expression: "variables.limit.matches('^[0-9]+$') && int(variables.limit) > 0"
    message: "pods need annotation slurmjob.slinky.slurm.net/timelimit (whole minutes, > 0)"
  - expression: >-
      !variables.limit.matches('^[0-9]+$') || !variables.maxHours.matches('^[0-9]+$') ||
      int(variables.limit) <= int(variables.maxHours) * 60
    messageExpression: "'time limit ' + variables.limit + ' min is over your maximum of ' + variables.maxHours + ' hours'"
  - expression: "variables.ann[?'slurmjob.slinky.slurm.net/exclusive'].orValue('') == 'false'"
    message: "pods need annotation slurmjob.slinky.slurm.net/exclusive: \"false\" (otherwise Slurm gives them the whole node)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: pod-has-time-limit }
spec:
  policyName: pod-has-time-limit
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions: [{ key: aistack/uid, operator: Exists }]
