# ONE shared MLflow (basic-auth) for all users, as an always-on service on master (the login node).
# Not a Slurm job: own namespace "mlflow", which slurm-bridge does not manage (its managedNamespaces: [slurm-bridge]),
# so the default scheduler places it and there is no time limit. Compute nodes stay free for training.
# Values that must match elsewhere:
#   192.168.40.102 / 30500  -> deploy.sh, ../mlflow-auth/sync-users.sh, ../ood-app/apps/mlflow_k8s/passenger_wsgi.py
#   --static-prefix         -> OOD proxies /node/<ip>/<port>/... unchanged, so MLflow must serve under that path
#   image tag               -> printed by build-image.sh
apiVersion: v1
kind: Namespace
metadata:
  name: mlflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow

spec:
  replicas: 1
  strategy:
    type: Recreate                              # SQLite: never two servers on the same db

  selector:
    matchLabels:
      app: mlflow

  template:
    metadata:
      labels:
        app: mlflow

    spec:
      nodeSelector:
        kubernetes.io/hostname: master

      tolerations:                              # master's two taints
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: slinky.slurm.net/managed-node
        operator: Exists
        effect: NoExecute

      securityContext:
        runAsUser: 1000                         # admin owns /home/apps/mlflow-shared (mode 700)
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }

      containers:
      - name: mlflow
        image: master:5000/mlflow-server:3.15.1
        imagePullPolicy: IfNotPresent

        args:
        - "server"
        - "--app-name"
        - "basic-auth"
        - "--backend-store-uri"
        - "sqlite:////data/mlflow.db"
        - "--artifacts-destination"
        - "/data/artifacts"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "5000"
        - "--workers"                           # more workers run out of memory at 2 GB
        - "1"
        - "--allowed-hosts"                     # MLflow 3.x answers only localhost by default
        - "*"
        - "--static-prefix"
        - "/node/192.168.40.102/30500"

        env:
        - name: MLFLOW_AUTH_CONFIG_PATH
          value: /data/basic_auth.ini           # written by deploy.sh
        - name: MLFLOW_FLASK_SERVER_SECRET_KEY
          valueFrom:
            secretKeyRef: { name: mlflow, key: flask-secret-key }

        ports:
        - name: http
          containerPort: 5000

        readinessProbe:                         # /health skips auth
          httpGet: { path: /node/192.168.40.102/30500/health, port: 5000 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /node/192.168.40.102/30500/health, port: 5000 }
          initialDelaySeconds: 60
          periodSeconds: 30

        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }

        resources:
          requests: { cpu: "1", memory: 1Gi }
          limits:   { cpu: "2", memory: 2Gi }

        volumeMounts:
        - { name: data, mountPath: /data }

      volumes:                                  # master's local disk: SQLite is safer here than over NFS
      - name: data
        hostPath: { path: /home/apps/mlflow-shared, type: Directory }

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow

spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30500                             # tracking URI uses master's IP
